# Fails when a generated README of this repository is stale (owner,
# 2026-10-01: "each repo owns its README" — no host regenerates it).
# bootstrap runs nothing itself: the generators are bootstrap-tools,
# checked out beside it exactly as pages.yml does.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bootstrap
      - uses: actions/checkout@v4
        with:
          repository: litlfred/bootstrap-tools
          path: bootstrap-tools
      - uses: oven-sh/setup-bun@v2
      - name: Install bootstrap-tools
        working-directory: bootstrap-tools
        run: bun install --frozen-lockfile
      - name: README generated sections are current
        working-directory: bootstrap-tools
        run: bun run scripts/readme-sections.ts --root ../bootstrap --check
      - name: Directory READMEs are current
        working-directory: bootstrap-tools
        run: bun run scripts/subgraph-readmes.ts --repo ../bootstrap --check
      - name: The schema page and schemas are current
        working-directory: bootstrap-tools
        run: bun run scripts/gen-bootstrap-schemas.ts --root ../bootstrap --check
